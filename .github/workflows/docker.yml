name: Build and Push Bot Image

on:
  push:
    branches:
      - feat/research-docs
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ./trading-engine
          file: ./trading-engine/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sui-deepbook-cetus-bot:latest
            ghcr.io/${{ env.OWNER_LC }}/sui-deepbook-cetus-bot:${{ github.sha }}
